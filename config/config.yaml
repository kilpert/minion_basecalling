  dorado_1.1.1_duplex:
    env: sleep $((RANDOM % 20 + 1)); GPU=$(workflow/scripts/which_gpu); echo "GPU:" $GPU; export CUDA_VISIBLE_DEVICES="$GPU"; # choose least used GPU on g1-9
    bin: opt/dorado/dorado-1.1.1-linux-x64/bin/dorado  
    extra: --recursive # paramter "--no-trim" is not allowd for dorado duplex!
    basecaller: duplex
    models_directory: resources/dorado_models/auto
    model:
      ## label: name or path
      ## fast: fast # automatic download
